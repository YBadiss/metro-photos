name: Deploy metro-boulot.photos Front

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-front.yml
      - app/front/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy metro-boulot.photos Front
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Install and build before the SSH key is loaded, so dependency code never has access to it.
      - name: Build
        working-directory: app/front
        env:
          VITE_API_URL: https://api.metro-boulot.photos
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Trust only the pinned server host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS" || { echo "SSH_KNOWN_HOSTS secret is not set" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Deploy
        working-directory: app/front
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: bun run deploy
